<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send an Errand — Mitini Runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A24;
    --ink-soft: #4B5A50;
    --base: #EFE9D9;
    --card: #F8F5EA;
    --river: #2F6F5E;
    --river-dark: #234F43;
    --brass: #A97E33;
    --line: #D8D0BA;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EDE8DA;
      --ink-soft: #B9C2B9;
      --base: #16201B;
      --card: #1D2822;
      --river: #6FBBA3;
      --river-dark: #5AA48D;
      --brass: #D3A85C;
      --line: #33413A;
    }
  }
  :root[data-theme="dark"] {
    --ink: #EDE8DA;
    --ink-soft: #B9C2B9;
    --base: #16201B;
    --card: #1D2822;
    --river: #6FBBA3;
    --river-dark: #5AA48D;
    --brass: #D3A85C;
    --line: #33413A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--base);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    min-height: 100%;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 22px 56px;
  }
  header { margin-bottom: 28px; }
  .eyebrow {
    color: var(--river);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.12;
    margin: 0 0 12px;
    color: var(--ink);
  }
  header p {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 38ch;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-size: 13px;
    color: var(--ink-soft);
  }
  label .req { color: var(--river); }
  input, textarea {
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    width: 100%;
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--river);
    outline-offset: 1px;
  }
  textarea { min-height: 84px; }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  button {
    margin-top: 8px;
    background: var(--river-dark);
    color: #F8F5EA;
    border: none;
    border-radius: 10px;
    padding: 15px 18px;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: var(--river); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 10px;
  }
  .error {
    font-size: 12.5px;
    color: #B3492E;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Errand service, Warri</p>
    <h1>What do you need picked up or done?</h1>
    <p>Fill this in and it opens WhatsApp with your order ready to send.</p>
  </header>

  <form id="orderForm" novalidate>
    <div class="field">
      <label for="name">Your name <span class="req">*</span></label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="phone">Your phone number <span class="req">*</span></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
    </div>

    <div class="field">
      <label for="item">Item / errand <span class="req">*</span></label>
      <textarea id="item" name="item" placeholder="e.g. 2 bags of rice, drop a document at the bank, pick up a package" required></textarea>
    </div>

    <div class="field">
      <label for="location">Delivery location <span class="req">*</span></label>
      <input id="location" name="location" type="text" placeholder="Address or landmark" required>
    </div>

    <div class="row2">
      <div class="field">
        <label for="budget">Budget (₦)</label>
        <input id="budget" name="budget" type="text" inputmode="numeric" placeholder="Optional">
      </div>
      <div class="field">
        <label for="when">Needed by</label>
        <input id="when" name="when" type="text" placeholder="e.g. Today, 5pm">
      </div>
    </div>

    <div class="field">
      <label for="notes">Any other notes</label>
      <textarea id="notes" name="notes" placeholder="Size, brand, gate code, anything else"></textarea>
    </div>

    <div class="error" id="formError" role="alert"></div>
    <button type="submit">Send order on WhatsApp</button>
    <p class="hint">Opens WhatsApp with your order filled in — just hit send there.</p>
  </form>
</div>

<script>
  const WHATSAPP_NUMBER = "2349072250871";
  const form = document.getElementById('orderForm');
  const errorEl = document.getElementById('formError');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.textContent = '';

    const name = form.name.value.trim();
    const phone = form.phone.value.trim();
    const item = form.item.value.trim();
    const location = form.location.value.trim();
    const budget = form.budget.value.trim();
    const when = form.when.value.trim();
    const notes = form.notes.value.trim();

    if (!name || !phone || !item || !location) {
      errorEl.textContent = 'Please fill in name, phone, errand, and location.';
      return;
    }

    let msg = `New errand order\n\n`;
    msg += `Name: ${name}\n`;
    msg += `Phone: ${phone}\n`;
    msg += `Errand: ${item}\n`;
    msg += `Location: ${location}\n`;
    if (budget) msg += `Budget: ₦${budget}\n`;
    if (when) msg += `Needed by: ${when}\n`;
    if (notes) msg += `Notes: ${notes}\n`;

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  });
</script>
</body>
</html>
